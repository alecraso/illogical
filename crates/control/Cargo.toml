[package]
name = "illogical-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "illogical control: accounts, devices, the directory and the relay"

[[bin]]
name = "illogical-control"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
illogical-e2e = { version = "0.1.0", path = "../e2e" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tokio-tungstenite = "0.30.0"

[package]
name = "illogical-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "illogical control: accounts, devices, the directory and the relay"

[[bin]]
name = "illogical-control"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.18.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
illogical-core = { version = "0.25.0", path = "../core" }
illogical-control-wire = { version = "0.25.0", path = "../control-wire" }
illogical-e2e = { version = "0.25.0", path = "../e2e" }
libc = "0.2.189"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
russh = { version = "0.64.0", default-features = false, features = ["aws-lc-rs"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-root-certs = "1.0.9"

[lints]
workspace = true

[dev-dependencies]
aes-gcm = "0.11.1"
hkdf = "0.13.0"

[features]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
debug-embed = ["rust-embed/debug-embed"]

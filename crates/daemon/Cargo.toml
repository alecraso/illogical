[package]
name = "illogicald"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
hkdf = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
illogical-core = { version = "0.16.0", path = "../core" }
illogical-e2e = { version = "0.16.0", path = "../e2e" }
illogical-proto = { version = "0.16.0", path = "../proto" }
illogical-vt = { version = "0.16.0", path = "../vt" }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
nix = { version = "0.31.3", features = ["term", "process", "fs", "ioctl", "signal", "poll", "socket", "uio", "hostname", "user", "dir"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rustls-platform-verifier = "0.7.1"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
# MCP (M16), pinned: 3.x moves fast (S14).
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hmac = "0.13.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"
tower = { version = "0.5.3", features = ["util"] }
hex = "0.4.3"
url = "2.5.8"
webpki-root-certs = "1.0.9"
zstd = "0.14.0"

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-unix-socket", "transport-streamable-http-client-reqwest", "transport-child-process"] }
rcgen = "0.14.10"

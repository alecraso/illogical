[package]
name = "illogicald"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
futures-util = "0.3.34"
# The OS's random source on every system (not /dev/urandom, which Windows lacks).
getrandom = "0.4"
hkdf = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
illogical-core = { version = "0.23.0", path = "../core" }
illogical-e2e = { version = "0.23.0", path = "../e2e" }
illogical-proto = { version = "0.23.0", path = "../proto" }
illogical-vt = { version = "0.23.0", path = "../vt" }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rustls-platform-verifier = "0.7.1"
# The guest ssh server (M65).
russh = { version = "0.64.0", default-features = false, features = ["aws-lc-rs"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
# MCP (M16), pinned: 3.x moves fast (S14).
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
hmac = "0.13.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"
tower = { version = "0.5.3", features = ["util"] }
hex = "0.4.3"
url = "2.5.8"
webpki-root-certs = "1.0.9"
zstd = "0.14.0"

# ptys, signals, sockets: Unix only. Windows gets ConPTY and named pipes (M56).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term", "process", "fs", "ioctl", "signal", "poll", "socket", "uio", "hostname", "user", "dir"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
illogical-testkit = { path = "../testkit" }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
# instant-acme's features (aws-lc-rs): the defaults add ring (#466).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }

[target.'cfg(unix)'.dev-dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["transport-streamable-http-client-unix-socket"] }

[features]
# Embed web/dist even in a debug build (rust-embed reads it from the source
# tree at run time otherwise): CI's e2e shards run binaries built in another
# job's checkout.
debug-embed = ["rust-embed/debug-embed"]

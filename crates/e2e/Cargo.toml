[package]
name = "illogical-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Its RustCrypto resolver only: its `std` feature turns on `ring/std`, which
# builds ring (a second crypto backend beside aws-lc-rs) for nothing (#466).
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto"] }
tokio = { version = "1.53.1", features = ["sync", "io-util", "rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["full"] }

tokio-tungstenite = "0.30.0"

[package]
name = "illogical"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
illogical-core = { version = "0.16.0", path = "../core" }
illogical-proto = { version = "0.16.0", path = "../proto" }
illogical-vt = { version = "0.16.0", path = "../vt" }
nix = { version = "0.31.3", features = ["term", "poll", "signal", "ioctl", "hostname"] }
ratatui = "0.29.0"
rustls = "0.23.45"
rustls-platform-verifier = "0.7.1"
serde_json = "1.0.151"
tungstenite = "0.30.0"
webpki-root-certs = "1.0.9"
zstd = "0.14.0"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"

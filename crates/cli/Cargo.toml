[package]
name = "illogical"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
illogical-core = { version = "0.25.0", path = "../core" }
illogical-e2e = { version = "0.25.0", path = "../e2e" }
illogical-proto = { version = "0.25.0", path = "../proto" }
illogical-vt = { version = "0.25.0", path = "../vt" }
ratatui = "0.29.0"
rustls = "0.23.45"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tungstenite = "0.30.0"
webpki-root-certs = "1.0.9"
zstd = "0.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term", "poll", "signal", "ioctl", "hostname"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>illogical</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1e1e2e; color: #cdd6f4; font: 14px system-ui, sans-serif; }
  main { max-width: 34rem; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { line-height: 1.5; color: #bac2de; }
  code { background: #11111b; padding: 2px 6px; border-radius: 4px; }
  pre { background: #11111b; padding: 10px; border-radius: 6px; white-space: pre-wrap; color: #f38ba8; }
  button { background: #cba6f7; color: #1e1e2e; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<main>
  <h1>Can't reach illogicald</h1>
  <p>The app shows the daemon on this machine, and it isn't answering. If <code>illogicald</code> is installed,
    Retry starts it (<code>illogicald install</code>); otherwise install it with
    <code>curl -fsSL https://illogical.widgets.wtf/install.sh | sh</code> or <code>brew install arugula-salad/tap/illogical</code>.</p>
  <pre id="why">…</pre>
  <button id="retry">Retry</button>
</main>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const why = document.getElementById("why");
  const button = document.getElementById("retry");
  invoke("daemon_status").then((s) => (why.textContent = s));
  button.onclick = async () => {
    button.disabled = true;
    why.textContent = "Starting illogicald…";
    try {
      await invoke("retry");
    } catch (e) {
      why.textContent = String(e);
      button.disabled = false;
    }
  };
</script>
</body>
</html>

# Notices for the desktop app's Rust crates (`just notices` writes
# THIRD_PARTY.md here, and the app carries it). As the root about.toml, plus
# MPL-2.0 (decided 2026-10-04): Tauri's HTML handling and `dirs` bring in
# cssparser, cssparser-macros, selectors, dtoa-short and option-ext, used
# unmodified; their source is on crates.io.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

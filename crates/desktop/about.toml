# Notices for the desktop app's Rust crates (`just notices` writes
# THIRD_PARTY.md here, and the app carries it). As the root about.toml, plus
# MPL-2.0 (decided 2026-10-04): Tauri's HTML handling and `dirs` bring in
# cssparser, cssparser-macros, selectors, dtoa-short and option-ext, used
# unmodified; their source is on crates.io.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Huddles (M63, the `native-calls` feature): WebRTC's audio processing
# (AEC3) through these crates, which have no license field. Their COPYING is
# Google's BSD-3-Clause (WebRTC's, with its PATENTS grant), which the
# license scanner misreads.
[webrtc-audio-processing.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "6db9d4840c6ff0fb3c37ace8e32cfd3eb6c6e759c67b4ecbee969cd8d75154a9"

[webrtc-audio-processing-config.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-config.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"

[webrtc-audio-processing-sys.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-sys.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"

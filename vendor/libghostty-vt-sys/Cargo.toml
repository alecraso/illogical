# Vendored from https://github.com/Uzaaft/libghostty-rs at 8953a74
# (crates/libghostty-vt-sys), so the build can patch Ghostty (patches/).
# The changes: build.rs applies patches/*.patch after checkout, and the
# bindgen tool is left out. The root Cargo.toml's [patch] points here.
[package]
name = "libghostty-vt-sys"
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uzaaft/libghostty-rs"
rust-version = "1.90"
links = "ghostty-vt"
build = "build.rs"

[lib]
doctest = false

[features]
default = ["vendored"]
vendored = []
pkg-config = ["dep:pkg-config"]
link-dynamic = []
kitty-graphics = []

[build-dependencies]
pkg-config = { version = "0.3", optional = true }

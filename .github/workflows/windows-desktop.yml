# The Windows desktop app's installer, on GitHub's own runners. It builds
# only when something the app is built from changes (#389): a daemon-only or
# web-only change doesn't need it. The workspace's Windows checks stay in
# windows.yml. Only main's pushes (never pull requests); a branch runs by
# hand. The workflow runs on every push to main and desktop-changed asks
# scripts/app-changed, the same question check.yml's desktop-check asks, so
# a push that leaves the app alone still reports `desktop`, as skipped.
# ci.green's windows phase (chant.workspace.json, #503) counts a skipped
# run as passed, and can't count a run that never happened.
name: windows-desktop
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Does the push change what the app is built from (scripts/app-changed)?
  desktop-changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ask.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: ask
        run: if scripts/app-changed "${{ github.event.before }}"; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  # M54 (#217): lint the desktop app and build its installer, kept as an
  # artifact for testing in the VM.
  desktop:
    needs: desktop-changed
    if: ${{ needs.desktop-changed.outputs.run == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: crates/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/desktop
      # Stand-ins for what the release builds (scripts/windows-dist): the
      # daemon, the CLI and Microsoft's ConPTY. This installer is for
      # checking the app; the release's carries the real ones.
      - run: |
          mkdir -p binaries
          for f in arugulad-x86_64-pc-windows-msvc.exe arugula-x86_64-pc-windows-msvc.exe conpty.dll OpenConsole.exe ConPTY-LICENSE.txt; do
            [ -e "binaries/$f" ] || : > "binaries/$f"
          done
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: arugula-desktop-windows-x86_64
          path: crates/desktop/target/release/bundle/nsis/*-setup.exe

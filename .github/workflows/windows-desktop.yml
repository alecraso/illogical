# The Windows desktop app's installer, on GitHub's own runners. It runs only
# when something the app is built from changes (#389): a daemon-only or
# web-only change doesn't need it. The workspace's Windows checks stay in
# windows.yml, on every change.
name: windows-desktop
on:
  push:
    branches: [main]
    paths: &app
      - crates/desktop/**
      # The app's only workspace deps, and the root manifest they inherit
      # their version and lints from.
      - crates/proto/**
      - crates/core/**
      - Cargo.toml
      # Bundled into the installer.
      - THIRD_PARTY.md
      - LICENSE-MIT
      - LICENSE-APACHE
      - .github/workflows/windows-desktop.yml
  pull_request:
    paths: *app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # M54 (#217): lint the desktop app and build its installer, kept as an
  # artifact for testing in the VM.
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: crates/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/desktop
      # Stand-ins for what the release builds (scripts/windows-dist): the
      # daemon, the CLI and Microsoft's ConPTY. This installer is for
      # checking the app; the release's carries the real ones.
      - run: |
          mkdir -p binaries
          for f in illogicald-x86_64-pc-windows-msvc.exe illogical-x86_64-pc-windows-msvc.exe conpty.dll OpenConsole.exe ConPTY-LICENSE.txt; do
            [ -e "binaries/$f" ] || : > "binaries/$f"
          done
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: illogical-desktop-windows-x86_64
          path: crates/desktop/target/release/bundle/nsis/*-setup.exe

# A `v*` tag, the daemon's release: build Linux (x86_64, arm64, static) and
# macOS (arm64, and x86_64 cross-compiled for Intel Macs) binaries, and a
# zip of illogicald and illogical for Windows (install.ps1's), attach them
# to the tag's release with SHA256SUMS, publish it as latest, and bump the
# Homebrew formula. No desktop app: it has its own release, app-v* tags
# (app-release.yml, #393), and the daemon updates itself (#391).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-version "$GITHUB_REF_NAME"
      - run: just static x86_64
      - run: just static aarch64
      - run: just dist
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: just build
      - run: just build-macos-x86_64
      - run: just dist
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub's runner: Jake has no Windows machine (M54, #217).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Zig for Ghostty's lib-vt, pnpm for the web client the daemon embeds.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # illogicald and illogical, with Microsoft's ConPTY: the zip
      # (install.ps1's, M59).
      - run: scripts/windows-dist "${GITHUB_REF_NAME#v}"
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/illogical-*-x86_64-pc-windows-msvc.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux, macos, windows]
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release sums "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release publish "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release homebrew "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}

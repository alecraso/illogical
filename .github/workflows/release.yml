# A `v*` tag: build Linux (x86_64, arm64, static) and macOS (arm64, and
# x86_64 cross-compiled for Intel Macs) binaries and the desktop app (a .deb
# and an AppImage for Linux x86_64, a zipped app for each macOS arch, an
# installer for Windows), attach them to the tag's release with SHA256SUMS,
# and bump the Homebrew formula.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-version "$GITHUB_REF_NAME"
      - run: just static x86_64
      - run: just static aarch64
      - run: just dist
      # In an Ubuntu 22.04 container (podman); fails if the bundles need a
      # newer glibc than 2.35 (#170).
      - run: just desktop
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/illogical-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: just build
      - run: just build-macos-x86_64
      - run: just dist
      - run: just desktop
      - run: just desktop x86_64
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/illogical-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub's runner: Jake has no Windows machine (M54, #217). The app only,
  # as a cloud client: the daemon comes to Windows in M59.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release check-desktop-version "$GITHUB_REF_NAME"
      - run: cd crates/desktop && npx --yes @tauri-apps/cli@2 build --bundles nsis
      - run: |
          mkdir -p dist
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/desktop/Cargo.toml | head -1)
          cp "crates/desktop/target/release/bundle/nsis/illogical_${v}_x64-setup.exe" dist/illogical-desktop-windows-x86_64-setup.exe
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/illogical-desktop-windows-x86_64-setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux, macos, windows]
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release sums "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release homebrew "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}

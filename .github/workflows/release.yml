# A `v*` tag: build Linux (x86_64, arm64, static) and macOS (arm64)
# binaries and the desktop app (a .deb, an .rpm and an AppImage for Linux
# x86_64 and arm64; a .dmg and a zipped app for macOS), attach them to the
# tag's release with SHA256SUMS and the updater's latest.json, and bump the
# Homebrew formula.
#
# Secrets the desktop app uses when they're set, and skips (saying which)
# when not: TAURI_SIGNING_PRIVATE_KEY and _PASSWORD (updater signatures),
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (Developer ID signing and
# notarization, #177).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-version "$GITHUB_REF_NAME"
      - run: just static x86_64
      - run: just static aarch64
      - run: just dist
      # In an Ubuntu 22.04 container (podman); fails if the bundles need a
      # newer glibc than 2.35 (#170). arm64 runs under qemu-user emulation.
      - run: just desktop-linux x86_64 && just desktop-linux aarch64
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/illogical-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: just build
      - run: just dist
      # Signed, notarized and stapled with the Developer ID when its secrets
      # are set; ad-hoc signed (and saying so) when not.
      - run: just desktop-macos
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/illogical-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux, macos]
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release sums "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release updater "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release homebrew "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}

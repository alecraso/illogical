# A `v*` tag: build Linux (x86_64, arm64, static) and macOS (arm64, and
# x86_64 cross-compiled for Intel Macs) binaries and the desktop app (a
# .deb, an .rpm and an AppImage for Linux x86_64 and arm64; a .dmg and a
# zipped app for each macOS arch; an installer for Windows), and a zip of
# illogicald and illogical for Windows (install.ps1's), attach them to
# the tag's release with SHA256SUMS and the updater's latest.json, and bump
# the Homebrew formula.
#
# Secrets the desktop app uses when they're set, and skips (saying which)
# when not: TAURI_SIGNING_PRIVATE_KEY and _PASSWORD (updater signatures),
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (Developer ID signing and
# notarization, #177).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-version "$GITHUB_REF_NAME"
      - run: just static x86_64
      - run: just static aarch64
      - run: just dist
      # In an Ubuntu 22.04 container (podman); fails if the bundles need a
      # newer glibc than 2.35 (#170). x86_64 only: geek has no arm64
      # emulation for podman, so the arm64 app moves to GitHub's arm runner
      # (#287).
      - run: just desktop-linux x86_64
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/illogical-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: just build
      - run: just build-macos-x86_64
      - run: just dist
      # Signed, notarized and stapled with the Developer ID when its secrets
      # are set; ad-hoc signed (and saying so) when not. The Intel app is
      # cross-compiled.
      - run: just desktop-macos aarch64 && just desktop-macos x86_64
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/illogical-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub's runner: Jake has no Windows machine (M54, #217). The app only,
  # as a cloud client: the daemon comes to Windows in M59.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release check-desktop-version "$GITHUB_REF_NAME"
      # Zig for Ghostty's lib-vt, pnpm for the web client the daemon embeds.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # illogicald and illogical, with Microsoft's ConPTY: the zip
      # (install.ps1's) and the app's sidecars (M59).
      - run: scripts/windows-dist "${GITHUB_REF_NAME#v}"
      - run: cd crates/desktop && npx --yes @tauri-apps/cli@2 build --bundles nsis
      - run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/desktop/Cargo.toml | head -1)
          cp "crates/desktop/target/release/bundle/nsis/illogical_${v}_x64-setup.exe" dist/illogical-desktop-windows-x86_64-setup.exe
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/illogical-desktop-windows-x86_64-setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/illogical-*-x86_64-pc-windows-msvc.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux, macos, windows]
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release sums "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release updater "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release publish "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release homebrew "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}

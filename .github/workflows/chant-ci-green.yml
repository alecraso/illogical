# Generated by chant — do not edit directly. Regenerate with: chant ci workflow (in the workspace root)
name: chant-ci-green

# Tags each commit on the branch that passed its required phases ci/green/<sha>,
# and a green commit that later fails one ci/revoked/<sha> (#3573).
on:
  workflow_run:
    workflows:
      - "check"
      - "windows"
      - "windows-desktop"
    types:
      - completed
    branches:
      - "main"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# One tick at a time, and a tick in progress is never cancelled.
concurrency:
  group: chant-ci-green
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "main"
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Tag the commits that turned green, revoke the ones that turned red
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --yes @intentius/chant@0.108.0 ci tick

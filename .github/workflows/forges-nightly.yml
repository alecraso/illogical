# Nightly: forge blocks against real forges (#93). Never on pull requests:
# these run on our own machines.
#
# - github: crates/daemon/tests/integration/forges_github_real.rs against github.com,
#   with a test organization's repository, two bot accounts and a copy of
#   the GitHub App. Without those secrets the job says so and passes.
# - forgejo, gitlab: testnet/forges in Docker. Without Docker on the
#   runner the scripts say SKIP and pass.
name: forges-nightly
on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

jobs:
  github:
    runs-on: [self-hosted, linux-x86_64]
    env:
      ILLOGICAL_GH_TEST_REPO: ${{ vars.ILLOGICAL_GH_TEST_REPO }}
      ILLOGICAL_GH_AUTHOR_TOKEN: ${{ secrets.ILLOGICAL_GH_AUTHOR_TOKEN }}
      ILLOGICAL_GH_REVIEWER_TOKEN: ${{ secrets.ILLOGICAL_GH_REVIEWER_TOKEN }}
      ILLOGICAL_GH_APP_ID: ${{ vars.ILLOGICAL_GH_APP_ID }}
      ILLOGICAL_GH_APP_PRIVATE_KEY: ${{ secrets.ILLOGICAL_GH_APP_PRIVATE_KEY }}
    steps:
      - name: Are the test accounts configured?
        id: have
        run: |
          missing=""
          for v in ILLOGICAL_GH_TEST_REPO ILLOGICAL_GH_AUTHOR_TOKEN ILLOGICAL_GH_REVIEWER_TOKEN ILLOGICAL_GH_APP_ID ILLOGICAL_GH_APP_PRIVATE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::notice::GitHub forge tests skipped; not configured:$missing"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.have.outputs.run == 'true'
      - name: Keep the build between runs
        if: steps.have.outputs.run == 'true'
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/nightly" >> "$GITHUB_ENV"
      - if: steps.have.outputs.run == 'true'
        run: just bootstrap && just web
      - name: forges_github_real
        if: steps.have.outputs.run == 'true'
        run: mise exec -- cargo test -p illogicald --test integration forges_github_real:: -- --nocapture

  forges:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Keep the build between runs
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/nightly" >> "$GITHUB_ENV"
      - run: just bootstrap && just web
      - name: Forgejo
        run: just forges up forgejo && just forges test forgejo
      - name: GitLab CE
        run: just forges up gitlab && just forges test gitlab
      - name: Down
        if: always()
        run: just forges down all

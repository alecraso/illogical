# An `app-v*` tag, the desktop app's release (#393), apart from the
# daemon's `v*` ones: the app carries no daemon it builds itself. Each job
# downloads arugulad and arugula from the latest daemon release (checked
# against its SHA256SUMS: `scripts/release sidecars`), which the app installs
# on a machine with none. Then it builds the app: a .deb, an .rpm and an
# AppImage for each Linux arch, a .dmg and a zipped app for each macOS arch, an
# installer for Windows. `app-publish` writes SHA256SUMS and the updater's
# latest.json, publishes the release (never as latest: releases/latest is
# the daemon's), and copies it all to the rolling `app-latest` release, where
# the site's download links and the updater's endpoint point.
#
# Cut one only when crates/desktop changes: set its version in
# crates/desktop/Cargo.toml, then `git tag -a app-vX.Y.Z`.
#
# Secrets the app uses when they're set, and skips (saying which) when not:
# TAURI_SIGNING_PRIVATE_KEY and _PASSWORD (updater signatures),
# APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (Developer ID signing and
# notarization, #177).
name: app-release
on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

# scripts/release check-green: the tag's commit must have passed CI (#503).
# The repository variable ARUGULA_RELEASE_SKIP_GREEN=1 lets a release
# through anyway.
env:
  ARUGULA_RELEASE_SKIP_GREEN: ${{ vars.ARUGULA_RELEASE_SKIP_GREEN }}

jobs:
  linux:
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/app-release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      - run: scripts/release sidecars x86_64-unknown-linux-musl "$RUNNER_TEMP/sidecars"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # In an Ubuntu 22.04 container (podman); fails if the bundles need a
      # newer glibc than 2.35 (#170). x86_64 only: geek has no arm64
      # emulation for podman, so linux-arm64 builds that one.
      - run: just desktop-linux x86_64
        env:
          ARUGULA_DESKTOP_BINARIES: ${{ runner.temp }}/sidecars
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release app-upload "$GITHUB_REF_NAME" dist/arugula-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub's arm runner, free for a public repo (#287): the same container
  # build, natively.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      - run: scripts/release sidecars aarch64-unknown-linux-musl "$RUNNER_TEMP/sidecars"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: just desktop-linux aarch64
        env:
          ARUGULA_DESKTOP_BINARIES: ${{ runner.temp }}/sidecars
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release app-upload "$GITHUB_REF_NAME" dist/arugula-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/app-release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      - run: |
          scripts/release sidecars aarch64-apple-darwin "$RUNNER_TEMP/sidecars-aarch64"
          scripts/release sidecars x86_64-apple-darwin "$RUNNER_TEMP/sidecars-x86_64"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed, notarized and stapled with the Developer ID when its secrets
      # are set; ad-hoc signed (and saying so) when not. The Intel app is
      # cross-compiled.
      - run: |
          ARUGULA_DESKTOP_BINARIES="$RUNNER_TEMP/sidecars-aarch64" just desktop-macos aarch64
          ARUGULA_DESKTOP_BINARIES="$RUNNER_TEMP/sidecars-x86_64" just desktop-macos x86_64
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release app-upload "$GITHUB_REF_NAME" dist/arugula-desktop-*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub's runner: Jake has no Windows machine (M54, #217).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release check-app-version "$GITHUB_REF_NAME"
      # arugulad and arugula, with Microsoft's ConPTY, as the app carries
      # them (tauri.windows.conf.json).
      - run: |
          scripts/release sidecars x86_64-pc-windows-msvc "$RUNNER_TEMP/sidecars"
          b=crates/desktop/binaries
          mkdir -p "$b"
          cp "$RUNNER_TEMP/sidecars/arugulad.exe" "$b/arugulad-x86_64-pc-windows-msvc.exe"
          cp "$RUNNER_TEMP/sidecars/arugula.exe" "$b/arugula-x86_64-pc-windows-msvc.exe"
          cp "$RUNNER_TEMP/sidecars/conpty.dll" "$RUNNER_TEMP/sidecars/OpenConsole.exe" "$RUNNER_TEMP/sidecars/ConPTY-LICENSE.txt" "$b/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cd crates/desktop && npx --yes @tauri-apps/cli@2 build --bundles nsis
      - run: |
          mkdir -p dist
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/desktop/Cargo.toml | head -1)
          product=$(sed -n 's/^ *"productName": "\(.*\)",$/\1/p' crates/desktop/tauri.conf.json)
          cp "crates/desktop/target/release/bundle/nsis/${product}_${v}_x64-setup.exe" dist/arugula-desktop-windows-x86_64-setup.exe
      # The updater installs the installer itself, signed with the updater
      # key (#384).
      - run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx --yes @tauri-apps/cli@2 signer sign dist/arugula-desktop-windows-x86_64-setup.exe >/dev/null
            echo "signed the installer for the updater"
          else
            echo "no updater signature: TAURI_SIGNING_PRIVATE_KEY isn't set"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: scripts/release app-upload "$GITHUB_REF_NAME" dist/arugula-desktop-windows-x86_64-setup.exe*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux, linux-arm64, macos, windows]
    runs-on: [self-hosted, linux-x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release app-publish "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Moving app-latest: GITHUB_TOKEN gets 403 there (#526), as it
          # does tagging commits for chant-ci-green.
          TAG_TOKEN: ${{ secrets.CI_GREEN_TOKEN }}

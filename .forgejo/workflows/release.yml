# A `v*` tag: build Linux (x86_64, arm64, static) and macOS (arm64)
# binaries, attach them to the tag's release with SHA256SUMS, and bump the
# Homebrew formula.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: scripts/release check-version "$GITHUB_REF_NAME"
      - run: just static x86_64
      - run: just static aarch64
      - run: just dist
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - run: echo "CARGO_TARGET_DIR=$HOME/.cache/illogical-ci/release" >> "$GITHUB_ENV"
      - run: scripts/ci-cap-target 30
      - run: just bootstrap
      - run: just build
      - run: just dist
      - run: scripts/release upload "$GITHUB_REF_NAME" dist/*.tar.gz
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [linux, macos]
    runs-on: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release sums "$GITHUB_REF_NAME"
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/release homebrew "$GITHUB_REF_NAME"
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}

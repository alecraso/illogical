[package]
name = "s27-blocks"
version = "0.1.0"
edition = "2024"

# S27: blocks through control, end to end. One binary with two halves:
# `s27 control` (control's block origins, its static bootstrap files and the
# relay) and `s27 daemon` (the daemon's end of a block's Noise channel and
# the proxy to the block's port). See README.md.
[[bin]]
name = "s27"
path = "src/main.rs"

[dependencies]
illogical-e2e = { path = "../../crates/e2e" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1", "server", "service"] }
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio-tungstenite = "0.30.0"
tower = "0.5"

# Its own workspace: a spike, not part of the product build.
[workspace]

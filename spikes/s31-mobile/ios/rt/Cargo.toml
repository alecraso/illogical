[package]
name = "s31rt"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the repo's workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
illogical-vt = { path = "../../../../crates/vt" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["__rustls-tls"] }

[patch."https://github.com/Uzaaft/libghostty-rs.git"]
libghostty-vt-sys = { path = "../../../../vendor/libghostty-vt-sys" }

[profile.release]
opt-level = 3

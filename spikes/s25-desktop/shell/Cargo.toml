[package]
name = "s25-desktop"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# For click handling, which tauri-plugin-notification doesn't expose on desktop.
notify-rust = "4"

# Its own workspace: a spike, not part of the product build.
[workspace]

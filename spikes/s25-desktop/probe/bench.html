<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>S25 bench</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  body { margin: 0; background: #16181d; color: #ddd; font: 12px ui-monospace, monospace; }
  #term { width: 1200px; height: 720px; }
  #out { white-space: pre; padding: 6px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="out">bench: add ?auto to run, or press Enter in the terminal</div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script>
// The same terminal setup as web/src/terminal-view.ts (xterm 6 + WebGL),
// at a fixed size, so engines compare like for like.
const out = document.getElementById("out");
const term = new Terminal({ fontSize: 13, scrollback: 10000, allowProposedApi: true });
term.open(document.getElementById("term"));
let webgl = "on";
try {
  const gl = new WebglAddon.WebglAddon();
  gl.onContextLoss(() => { webgl = "lost"; });
  term.loadAddon(gl);
} catch (e) { webgl = "failed: " + e; }
term.resize(160, 48);

const enc = (s) => s;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const frame = () => new Promise((r) => requestAnimationFrame(r));
const pct = (xs, p) => { const s = [...xs].sort((a, b) => a - b); return s.length ? s[Math.min(s.length - 1, Math.floor((p / 100) * s.length))] : 0; };
const r1 = (x) => Math.round(x * 10) / 10;

// Frame intervals, collected for the whole run; each scenario slices them.
const intervals = [];
let lastT = 0;
(function loop(t) { if (lastT) intervals.push([t, t - lastT]); lastT = t; requestAnimationFrame(loop); })(0);
const framesBetween = (a, b) => intervals.filter(([t]) => t >= a && t <= b).map(([, d]) => d);

// Write-to-paint: write one character, wait for xterm's render, then the
// frame after it (when the compositor has it). Queued behind any output.
function probeOnce() {
  return new Promise((resolve) => {
    const t0 = performance.now();
    const sub = term.onRender(() => { sub.dispose(); requestAnimationFrame((t) => resolve(t - t0)); });
    term.write("\x1b7\x1b[1;150H#\x1b8");
  });
}

// Streams generated output with the client's kind of backpressure (a few
// writes in flight) for `ms`, probing latency every 100 ms meanwhile.
async function flood(name, gen, ms = 5000) {
  term.reset();
  await sleep(200);
  const t0 = performance.now();
  let bytes = 0, inflight = 0, stop = false;
  const lat = [];
  const prober = (async () => { while (!stop) { lat.push(await probeOnce()); await sleep(100); } })();
  while (performance.now() - t0 < ms) {
    if (inflight >= 4) { await new Promise((r) => setTimeout(r, 0)); continue; }
    const chunk = gen();
    inflight++;
    term.write(chunk, () => { inflight--; bytes += chunk.length; });
  }
  while (inflight > 0) await sleep(5);
  stop = true;
  await prober;
  const t1 = performance.now();
  const f = framesBetween(t0, t1);
  return {
    name, seconds: r1((t1 - t0) / 1000), mbps: r1(bytes / 1e6 / ((t1 - t0) / 1000)),
    fps: r1(f.length / ((t1 - t0) / 1000)), frame_p95: r1(pct(f, 95)), frame_max: r1(Math.max(0, ...f)),
    frames_over_50ms: f.filter((d) => d > 50).length,
    latency_p50: r1(pct(lat, 50)), latency_p95: r1(pct(lat, 95)), latency_max: r1(Math.max(0, ...lat)), latency_n: lat.length,
  };
}

// A full-screen program redrawing every frame (htop, vim scrolling): one
// screen of output per animation frame for `ms`.
async function redraw(name, screen, ms = 5000) {
  term.reset();
  await sleep(200);
  const t0 = performance.now();
  const lat = [], renders = [];
  let i = 0;
  while (performance.now() - t0 < ms) {
    const s = screen(i++);
    const w0 = performance.now();
    await new Promise((r) => term.write(s, r));
    renders.push(performance.now() - w0);
    if (i % 6 === 0) lat.push(await probeOnce()); else await frame();
  }
  const t1 = performance.now();
  const f = framesBetween(t0, t1);
  return {
    name, seconds: r1((t1 - t0) / 1000), screens_per_s: r1(i / ((t1 - t0) / 1000)),
    fps: r1(f.length / ((t1 - t0) / 1000)), frame_p95: r1(pct(f, 95)), frame_max: r1(Math.max(0, ...f)),
    frames_over_50ms: f.filter((d) => d > 50).length, parse_p95: r1(pct(renders, 95)),
    latency_p50: r1(pct(lat, 50)), latency_p95: r1(pct(lat, 95)), latency_max: r1(Math.max(0, ...lat)), latency_n: lat.length,
  };
}

const yes = "y\r\n".repeat(16384);
const words = "the quick brown fox jumps over lazy dog request handled cache miss retry ok warn error".split(" ");
let seq = 0;
const logChunk = () => {
  let s = "";
  for (let i = 0; i < 400; i++) {
    const lvl = ["\x1b[32mINFO\x1b[0m", "\x1b[33mWARN\x1b[0m", "\x1b[31mERROR\x1b[0m", "\x1b[2mDEBUG\x1b[0m"][seq % 4];
    s += `\x1b[90m2026-10-04T06:${String(seq % 60).padStart(2, "0")}:00.${seq % 1000}Z\x1b[0m ${lvl} \x1b[36msvc::worker${seq % 9}\x1b[0m `;
    for (let w = 0; w < 12; w++) s += words[(seq * 7 + w) % words.length] + " ";
    s += `id=${seq++}\r\n`;
  }
  return s;
};
const htop = (n) => {
  let s = "\x1b[H";
  for (let row = 0; row < 48; row++) {
    const pct = (row * 13 + n * 7) % 100;
    const bar = "|".repeat(Math.floor(pct / 2)).padEnd(50);
    s += `\x1b[${row + 1};1H\x1b[1;37m${String(row).padStart(3)}\x1b[0m [\x1b[32m${bar.slice(0, 30)}\x1b[31m${bar.slice(30)}\x1b[0m] ` +
      `\x1b[${row % 2 ? 44 : 40}m ${String(pct).padStart(3)}% ${String(1000 + ((n + row) * 37) % 9000)} jake  20 0 ${words[(n + row) % words.length].padEnd(60)}\x1b[0m`;
  }
  return s;
};
const vimScroll = (n) => {
  // Scroll region over the buffer, one new line per frame, plus the ruler.
  let s = "\x1b[1;47r\x1b[47;1H\n";
  s += `\x1b[47;1H\x1b[33m${String(n).padStart(5)}\x1b[0m fn handler_${n}(req: Request) -> Result<Response> { let id = req.id(); ${words[n % words.length]} }\x1b[K`;
  s += `\x1b[r\x1b[48;1H\x1b[7m src/main.rs  [+]  ${n},1  ${Math.min(100, n % 100)}% \x1b[K\x1b[0m`;
  return s;
};

async function idle() {
  term.reset();
  await sleep(300);
  const lat = [];
  for (let i = 0; i < 100; i++) { lat.push(await probeOnce()); await sleep(30); }
  return { name: "idle", latency_p50: r1(pct(lat, 50)), latency_p95: r1(pct(lat, 95)), latency_max: r1(Math.max(0, ...lat)), latency_n: lat.length };
}

async function run() {
  out.textContent = "running…";
  const gl = document.createElement("canvas").getContext("webgl2");
  const dbg = gl?.getExtension("WEBGL_debug_renderer_info");
  const result = {
    engine: navigator.userAgent,
    renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl?.getParameter(gl.RENDERER),
    dpr: devicePixelRatio, webgl, scenarios: [],
  };
  await sleep(500);
  const base = framesBetween(performance.now() - 400, performance.now());
  result.refresh_hz = r1(1000 / pct(base, 50));
  for (const s of [idle, () => flood("yes", () => yes), () => flood("log", logChunk), () => redraw("htop", htop), () => redraw("vim-scroll", vimScroll)]) {
    const r = await s();
    result.scenarios.push(r);
    out.textContent = JSON.stringify(result.scenarios.map((x) => x.name));
  }
  result.webgl = webgl;
  window.__s25result = result;
  out.textContent = JSON.stringify(result, null, 1);
  if (window.__TAURI__) window.__TAURI__.core.invoke("s25_report", { json: JSON.stringify(result) });
  console.log("S25RESULT " + JSON.stringify(result));
}

if (location.search.includes("auto") || window.__S25_FLAGS?.auto) setTimeout(run, 300);
term.onData((d) => { if (d === "\r") run(); });
term.focus();
</script>
</body>
</html>

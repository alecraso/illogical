<!doctype html><meta charset="utf-8"><title>evil</title>
<!-- Served by the dev server on the :10000 origin. Probes a TEST illogicald on
     127.0.0.1:17699 (stand-in for the app on :443). -->
<pre id="out"></pre>
<iframe id="f" src="http://127.0.0.1:17699/" style="width:600px;height:300px;opacity:.3"></iframe>
<script>
const out = {};
const done = () => { document.getElementById('out').textContent = JSON.stringify(out); document.title = 'done'; };
const ws = new WebSocket('ws://127.0.0.1:17699/ws');
ws.onopen = () => { out.ws = 'OPEN'; ws.close(); };
ws.onerror = () => { out.ws = out.ws || 'error'; };
ws.onclose = (e) => { out.ws = out.ws || 'closed ' + e.code; };
fetch('http://127.0.0.1:17699/', { mode: 'no-cors' }).then(r => out.nocors_get = 'sent, opaque=' + (r.type === 'opaque'), e => out.nocors_get = 'blocked: ' + e.message);
fetch('http://127.0.0.1:17699/').then(r => r.text()).then(t => out.cors_read = 'READ ' + t.length, e => out.cors_read = 'blocked: ' + e.message);
fetch('http://127.0.0.1:17699/ws', { method: 'POST', mode: 'no-cors', body: 'x' }).then(r => out.nocors_post = 'sent', e => out.nocors_post = 'blocked: ' + e.message);
document.getElementById('f').onload = () => { out.iframe = 'loaded'; try { out.iframe_dom = document.getElementById('f').contentDocument?.title ?? 'null doc'; } catch (e) { out.iframe_dom = e.name; } };
setTimeout(done, 4000);
</script>

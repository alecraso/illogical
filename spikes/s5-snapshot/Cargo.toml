[package]
name = "s5-snapshot"
version = "0.1.0"
edition = "2024"

[dependencies]
# libghostty-rs master: the first version that binds ghostty_snapshot_*.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "8953a74" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Its own workspace: this spike builds a newer Ghostty than the main crates.
[workspace]

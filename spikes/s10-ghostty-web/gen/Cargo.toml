[package]
name = "s10-gen"
version = "0.1.0"
edition = "2024"

# Uses the daemon's own engine, so the bytes are exactly what it sends.
[dependencies]
illogical-vt = { path = "../../../crates/vt" }
zstd = "0.14.0"
# Same rev as crates/vt, for the reference cell grid.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "8953a74" }
serde_json = "1"

# Its own workspace and target dir (work/target), not the shared one.
[workspace]

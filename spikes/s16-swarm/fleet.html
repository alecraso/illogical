<!doctype html><meta charset="utf-8"><title>S16 fleet</title>
<script>
// One page holding a summary connection to every daemon in ?ports=, with
// the real client's reconnect policy (web/src/client.ts: 250 ms doubling to
// 5 s, reset on open). window.__fleet has what the bench reads.
const ports = new URLSearchParams(location.search).get("ports").split(",").filter(Boolean).map(Number);
const conns = ports.map((port) => ({ port, ws: null, retry: 0, hellos: 0, states: 0, bytes: 0, helloAt: 0, failures: 0, state: null }));
window.__fleet = { conns, paused: false };
function connect(c) {
  const ws = new WebSocket(`ws://127.0.0.1:${c.port}/ws`);
  c.ws = ws;
  ws.onmessage = (e) => {
    if (typeof e.data !== "string") return;
    c.bytes += e.data.length;
    const m = JSON.parse(e.data);
    if (m.type === "hello") { c.hellos++; c.helloAt = performance.now(); c.retry = 0; c.state = m.state; }
    else if (m.type === "state") { c.states++; c.state = m.state; }
  };
  ws.onclose = () => {
    if (c.ws !== ws) return;
    c.ws = null;
    if (window.__fleet.paused) return;
    c.failures++;
    const delay = Math.min(250 * 2 ** c.retry, 5000);
    c.retry++;
    setTimeout(() => connect(c), delay);
  };
}
// The network going away: every socket dies and nothing reconnects.
window.__sleep = () => { window.__fleet.paused = true; for (const c of conns) { const ws = c.ws; c.ws = null; ws?.close(); } };
// Waking: everything reconnects at once (the client's `wake`).
window.__wake = () => { window.__fleet.paused = false; window.__wakeAt = performance.now(); for (const c of conns) { c.retry = 0; connect(c); } };
window.__start = () => conns.forEach(connect);
window.__panes = () => conns.reduce((n, c) => n + (c.state ? c.state.panes.length : 0), 0);
</script>

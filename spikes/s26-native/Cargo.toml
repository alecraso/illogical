# Its own workspace: a spike, not part of the product build.
[workspace]
resolver = "3"
members = ["core", "gtk", "ffi"]
default-members = ["core", "ffi"]

# The daemon's engine, patched the same way (M9): see vendor/libghostty-vt-sys.
[patch."https://github.com/Uzaaft/libghostty-rs.git"]
libghostty-vt-sys = { path = "../../vendor/libghostty-vt-sys" }

[profile.release]
debug = 1

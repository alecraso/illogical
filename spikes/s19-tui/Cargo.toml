[package]
name = "s19-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
illogical-proto = { path = "../../crates/proto" }
# The same pin as crates/vt, so the Ghostty build is shared.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "8953a74" }
nix = { version = "0.31", features = ["term", "poll", "ioctl"] }
ratatui = "0.29"
serde_json = "1"
tungstenite = "0.30"
zstd = "0.14"

# Its own workspace: a spike, not part of the product build.
[workspace]

[package]
name = "s15"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.151"
snow = "0.10.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[workspace]

# S15's throwaway relay. `fly apps destroy illogical-s15-relay` when done.
app = "illogical-s15-relay"
primary_region = "ewr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S15 share link</title>
<meta property="og:title" content="S15 share link test" />
<meta property="og:description" content="A read-only link whose key is in the fragment." />
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; max-width: 40rem; }
</style>
<h1>S15: share-link fragment</h1>
<p id="out"></p>
<script>
  // A read-only link carries its key after '#', which browsers never send
  // in a request. The relay logs every fetch of this page and its
  // User-Agent; this script reports whether whoever ran it saw a fragment.
  // A link preview (Slack, iMessage, Discord) that runs scripts would show
  // up here with its own User-Agent.
  const frag = location.hash.slice(1);
  document.getElementById("out").textContent = frag
    ? `This page sees the fragment (${frag.length} chars). The server never did.`
    : "No fragment here.";
  fetch("/report", { method: "POST", body: JSON.stringify({ test: "share", sawFragment: !!frag, fragment: frag, ua: navigator.userAgent }) });
</script>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S15 relay round trip</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; max-width: 40rem; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; word-break: break-all; }
  button { font-size: 17px; padding: 10px 14px; margin: 4px 4px 4px 0; }
</style>
<h1>S15: relay round trip</h1>
<p>Pick the network you're on. It times this phone to the relay, then an
end-to-end encrypted channel through the relay to the home machine, then
(on the tailnet) the direct path. Results are sent to the relay's log.</p>
<p>
  <button data-net="cellular">On cellular</button>
  <button data-net="wifi">On Wi-Fi</button>
</p>
<pre id="out">waiting</pre>
<script type="module">
  import { deviceKey, Initiator } from "./dist/noise.js";

  const out = document.getElementById("out");
  const enc = new TextEncoder();
  const params = new URLSearchParams(location.search);
  let log = [];
  const say = (s) => (log.push(s), (out.textContent = log.join("\n")));
  const stats = (v) => {
    v = [...v].sort((a, b) => a - b);
    const p = (q) => v[Math.min(v.length - 1, Math.floor((v.length - 1) * q))].toFixed(1);
    return { p50: +p(0.5), p90: +p(0.9), p99: +p(0.99) };
  };

  function socket(url) {
    const ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    const msgs = [];
    let wake;
    ws.onmessage = (e) => (msgs.push(typeof e.data === "string" ? e.data : new Uint8Array(e.data)), wake?.());
    ws.next = async () => {
      while (!msgs.length) {
        if (ws.readyState > 1) throw new Error("socket closed");
        await new Promise((r) => (wake = r));
      }
      return msgs.shift();
    };
    ws.onclose = () => wake?.();
    return new Promise((res, rej) => ((ws.onopen = () => res(ws)), (ws.onerror = () => rej(new Error("connect failed: " + url)))));
  }

  async function relayLeg(host) {
    const ws = await socket(`wss://${host}/echo`);
    const r = [];
    for (let i = 0; i < 50; i++) {
      const t = performance.now();
      ws.send("x");
      await ws.next();
      r.push(performance.now() - t);
    }
    ws.close();
    return stats(r);
  }

  async function channel(url, peer, key) {
    const t0 = performance.now();
    const ws = await socket(url);
    const connect = performance.now() - t0;
    const t1 = performance.now();
    const ik = new Initiator(key, peer);
    ws.send(await ik.write(enc.encode("attach")));
    const { channel } = await ik.read(await ws.next());
    const handshake = performance.now() - t1;
    const r = [];
    for (let i = 0; i < 100; i++) {
      const t = performance.now();
      ws.send(await channel.send.seal(enc.encode("ea")));
      await channel.recv.open(await ws.next());
      r.push(performance.now() - t);
    }
    const req = new Uint8Array(5);
    req[0] = 0x62;
    new DataView(req.buffer).setUint32(1, 1 << 20);
    const t2 = performance.now();
    ws.send(await channel.send.seal(req));
    for (;;) {
      const m = await channel.recv.open(await ws.next());
      if (m.length === 1 && m[0] === 0x64) break;
    }
    const burst = performance.now() - t2;
    ws.close();
    return { connectMs: +connect.toFixed(1), handshakeMs: +handshake.toFixed(1), keystroke: stats(r), burst1MBms: +burst.toFixed(0) };
  }

  async function run(net) {
    log = [];
    const result = { test: "rtt", net, effectiveType: navigator.connection?.effectiveType, ua: navigator.userAgent };
    try {
      const host = location.host;
      const { daemons } = await (await fetch("/info")).json();
      const [name, pub] = Object.entries(daemons)[0] ?? [];
      if (!name) throw new Error("no daemon is connected to the relay");
      const peer = Uint8Array.from(pub.match(/../g).map((h) => parseInt(h, 16)));
      const key = await deviceKey();
      say(`daemon ${name}; timing phone -> relay…`);
      result.phoneToRelay = await relayLeg(host);
      say(`phone -> relay: ${JSON.stringify(result.phoneToRelay)} ms\nrelayed channel…`);
      result.relayed = await channel(`wss://${host}/c/${name}`, peer, key);
      say(`relayed: ${JSON.stringify(result.relayed)}`);
      const direct = params.get("direct");
      if (direct) {
        say("direct channel (tailnet)…");
        try {
          result.direct = await channel(direct, peer, key);
          say(`direct: ${JSON.stringify(result.direct)}`);
        } catch (e) {
          result.direct = String(e);
          say(`direct: ${e} (fine on cellular without Tailscale)`);
        }
      }
      say("\ndone, sent to the relay log");
    } catch (e) {
      result.error = String(e);
      say(`error: ${e}`);
    }
    await fetch("/report", { method: "POST", body: JSON.stringify(result) });
  }
  for (const b of document.querySelectorAll("button[data-net]")) b.onclick = () => run(b.dataset.net);
</script>

<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S15 device keys</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; max-width: 40rem; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; word-break: break-all; }
  button { font-size: 16px; padding: 8px 12px; margin: 4px 0; }
</style>
<h1>S15: device keys in this browser</h1>
<p>Checks run on load. <b>Reload</b> to check the key survived. The passkey
buttons test the WebAuthn PRF extension (re-deriving a device key after the
browser forgets it).</p>
<p>
  <button id="reg">1. Create a passkey (with PRF)</button><br />
  <button id="auth">2. Sign in with it and derive a key</button><br />
  <button id="clear">Forget the stored key</button>
</p>
<pre id="out">running…</pre>
<script type="module">
  import { deviceKey, publicRaw, Initiator } from "./dist/noise.js";

  const out = document.getElementById("out");
  const results = {};
  const show = () => (out.textContent = JSON.stringify(results, null, 2));
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const params = new URLSearchParams(location.search);
  results.userAgent = navigator.userAgent;

  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("s15", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("keys");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function kv(mode, fn) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction("keys", mode);
      const req = fn(tx.objectStore("keys"));
      tx.oncomplete = () => res(req?.result);
      tx.onerror = () => rej(tx.error);
    });
  }

  async function check(name, fn) {
    try {
      results[name] = await fn();
    } catch (e) {
      results[name] = `FAIL: ${e?.name ?? ""} ${e?.message ?? e}`;
    }
    show();
  }

  await check("x25519", async () => {
    const k = await deviceKey();
    try {
      await crypto.subtle.exportKey("pkcs8", k.privateKey);
      return "FAIL: private key exported";
    } catch {
      return "ok, non-extractable";
    }
  });
  await check("ed25519", async () => {
    const k = await crypto.subtle.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);
    const sig = await crypto.subtle.sign("Ed25519", k.privateKey, new TextEncoder().encode("approve"));
    const ok = await crypto.subtle.verify("Ed25519", k.publicKey, sig, new TextEncoder().encode("approve"));
    return ok ? "ok" : "FAIL: verify";
  });
  await check("storedKey", async () => {
    let k = await kv("readonly", (s) => s.get("device"));
    if (k) return `ok, survived: ${hex(await publicRaw(k.publicKey)).slice(0, 16)}…`;
    k = await deviceKey();
    await kv("readwrite", (s) => s.put(k, "device"));
    return `created ${hex(await publicRaw(k.publicKey)).slice(0, 16)}… (reload to check it survives)`;
  });
  await check("persist", async () =>
    navigator.storage?.persist ? `persist() = ${await navigator.storage.persist()}` : "no StorageManager.persist",
  );
  await check("prfAvailable", async () => {
    const caps = await PublicKeyCredential.getClientCapabilities?.();
    return caps ? `extension:prf = ${caps["extension:prf"]}` : "getClientCapabilities missing";
  });

  // Interop with the spike daemon, when ?daemon=ws://…&peer=HEX is given.
  if (params.get("daemon")) {
    await check("noise", async () => {
      const peer = Uint8Array.from(params.get("peer").match(/../g).map((h) => parseInt(h, 16)));
      const k = await kv("readonly", (s) => s.get("device"));
      const ws = new WebSocket(params.get("daemon"));
      ws.binaryType = "arraybuffer";
      const msgs = [];
      let wake;
      ws.onmessage = (e) => (msgs.push(new Uint8Array(e.data)), wake?.());
      const next = async () => {
        while (!msgs.length) await new Promise((r) => (wake = r));
        return msgs.shift();
      };
      await new Promise((r, j) => ((ws.onopen = r), (ws.onerror = j)));
      const t = performance.now();
      const ik = new Initiator(k, peer);
      ws.send(await ik.write(new TextEncoder().encode("attach")));
      const { payload, channel } = await ik.read(await next());
      const hs = performance.now() - t;
      ws.send(await channel.send.seal(new TextEncoder().encode("ehi")));
      const echo = new TextDecoder().decode(await channel.recv.open(await next()));
      ws.close();
      return `ok: handshake ${hs.toFixed(1)} ms, hello "${new TextDecoder().decode(payload)}", echo "${echo}"`;
    });
  }

  // PRF: a passkey whose PRF output (fixed salt) seeds a device key, so a
  // browser that lost IndexedDB can get the same key back.
  const salt = new TextEncoder().encode("illogical device key v1".padEnd(32, "."));
  document.getElementById("reg").onclick = () =>
    check("prfRegister", async () => {
      const cred = await navigator.credentials.create({
        publicKey: {
          rp: { name: "illogical S15" },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "s15", displayName: "S15 test" },
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
          authenticatorSelection: { residentKey: "required", userVerification: "required" },
          extensions: { prf: { eval: { first: salt } } },
        },
      });
      const ext = cred.getClientExtensionResults().prf;
      localStorage.setItem("s15-cred", hex(cred.rawId));
      return `enabled=${ext?.enabled}, result at create=${ext?.results?.first ? "yes" : "no"}`;
    });
  document.getElementById("auth").onclick = () =>
    check("prfAuthenticate", async () => {
      const a = await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          userVerification: "required",
          extensions: { prf: { eval: { first: salt } } },
        },
      });
      const first = a.getClientExtensionResults().prf?.results?.first;
      if (!first) return "FAIL: no PRF output";
      // The PRF output is the seed of an X25519 key: import it as PKCS#8,
      // non-extractable. Same passkey, same salt: same key.
      const pkcs8 = new Uint8Array([0x30, 0x2e, 0x02, 0x01, 0x00, 0x30, 0x05, 0x06, 0x03, 0x2b, 0x65, 0x6e, 0x04, 0x22, 0x04, 0x20, ...new Uint8Array(first)]);
      const priv = await crypto.subtle.importKey("pkcs8", pkcs8, { name: "X25519" }, false, ["deriveBits"]);
      const prev = localStorage.getItem("s15-prf-fp");
      const fp = hex(await crypto.subtle.digest("SHA-256", first)).slice(0, 16);
      localStorage.setItem("s15-prf-fp", fp);
      return `ok: derived key ${priv.type}; seed fingerprint ${fp}${prev ? (prev === fp ? " (same as last time)" : ` (DIFFERENT from ${prev})`) : ""}`;
    });
  document.getElementById("clear").onclick = () =>
    check("cleared", async () => (await kv("readwrite", (s) => s.delete("device")), "stored key deleted; reload"));
  window.s15 = results;
  results.done = true;
  show();
</script>

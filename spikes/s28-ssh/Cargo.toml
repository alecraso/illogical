[package]
name = "s28-ssh"
version = "0.1.0"
edition = "2024"

# The raw stdio bridge S28 measured: one connection to the daemon's socket per
# run, so one per ssh channel. No dependencies, so it builds for musl as is.
[[bin]]
name = "s28-bridge"
path = "src/main.rs"

# Its own workspace: a spike, not part of the product build.
[workspace]

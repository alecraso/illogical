[package]
name = "s30-mls"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "0.9.0" }
openmls_rust_crypto = { version = "0.6.0", optional = true }
openmls_basic_credential = "0.6.0"
openmls_traits = "0.6.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
openmls_libcrux_crypto = { version = "0.4.0", optional = true }

[features]
default = ["rustcrypto"]
rustcrypto = ["dep:openmls_rust_crypto"]
# libcrux (formally verified primitives) instead: --no-default-features --features libcrux
libcrux = ["dep:openmls_libcrux_crypto"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9.0", features = ["js"] }
wasm-bindgen = "0.2"
# Three getrandom majors end up in the tree (0.2 via rand_core 0.6 / ed25519-dalek,
# 0.3 via openmls' `js`, 0.4 via the RustCrypto pre-releases); each needs its own switch.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# Native timings: plain release.
[profile.release]
opt-level = 3

# wasm: smallest build.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm, tuned for speed instead, to compare.
[profile.wasm-fast]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]

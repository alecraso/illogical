<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S30 call</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#111;--fg:#ddd;--dim:#888;--ok:#6c6;--bad:#e66}
body{font:15px ui-monospace,monospace;margin:16px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:10px 16px;margin:4px 4px 12px 0}
pre{white-space:pre-wrap}.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
</style>
<h1>S30 call</h1>
<p class="dim">Room <b id="room"></b>. Joins the room, offers (or answers, with role=answer), and signs its DTLS fingerprint.</p>
<button id="go">Start call</button><button id="mute">Mute</button><button id="hang">Hang up</button>
<pre id="status"></pre>
<pre id="stats" class="dim"></pre>
<audio id="remote" autoplay playsinline></audio>
<script>if (new URLSearchParams(location.search).get("silent")) document.getElementById("remote").muted = true;</script>
<script type="module">
// The browser side of S30's call demo. Signaling goes through server.mjs
// (standing in for the session's daemon). Each side signs the
// `a=fingerprint` lines of its SDP with an Ed25519 key, and checks the
// other's, so a signaling server that swaps fingerprints is caught.
// In M63 the key would be the device key and the peer's would come from
// its device certificate; here ?peer=KEY pins it.
const q = new URLSearchParams(location.search);
const room = q.get("room") || "r1";
const role = q.get("role") || "offer";
const client = q.get("client") || "browser";
document.getElementById("room").textContent = room;
const status = document.getElementById("status"), statsEl = document.getElementById("stats");
const log = (s, cls = "") => { status.innerHTML += `<span class="${cls}">${new Date().toISOString().slice(11, 23)} ${s}</span>\n`; };
const b64 = (u8) => btoa(String.fromCharCode(...new Uint8Array(u8)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const fps = (sdp) => sdp.split(/\r?\n/).filter((l) => l.startsWith("a=fingerprint:")).map((l) => l.trim()).join("\n");
const summary = { client, room, role, ua: navigator.userAgent, events: [] };
const mark = (e) => summary.events.push([Math.round(performance.now()), e]);

let pc, ws, stream, key, pub, analyser;
async function start() {
  document.getElementById("go").disabled = true;
  key = await crypto.subtle.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);
  pub = b64(await crypto.subtle.exportKey("raw", key.publicKey));
  log("my key " + pub);
  if (q.get("tone")) {
    const ctx = new AudioContext(); const o = ctx.createOscillator(); o.frequency.value = 660;
    const g = ctx.createGain(); g.gain.value = 0.2; const d = ctx.createMediaStreamDestination();
    o.connect(g).connect(d); o.start(); stream = d.stream; log("source: 660 Hz tone");
  } else {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    log("source: " + stream.getAudioTracks()[0].label);
  }
  if (q.get("mute")) { stream.getAudioTracks().forEach((t) => (t.enabled = false)); log("muted");
  }
  const ice = [];
  if (q.get("turn")) ice.push({ urls: q.get("turn"), username: q.get("user"), credential: q.get("pass") });
  pc = new RTCPeerConnection({ iceServers: ice, iceTransportPolicy: q.get("relay") ? "relay" : "all" });
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.ontrack = (e) => {
    const rs = e.streams[0] || new MediaStream([e.track]);
    document.getElementById("remote").srcObject = rs; log("remote audio track"); mark("track");
    // Measure what arrives (peak frequency and level) without needing ears.
    const ctx = new AudioContext(); ctx.resume();
    analyser = ctx.createAnalyser(); analyser.fftSize = 8192; analyser.rate = ctx.sampleRate;
    ctx.createMediaStreamSource(rs).connect(analyser);
  };
  pc.onconnectionstatechange = () => { log("connection: " + pc.connectionState, pc.connectionState === "connected" ? "ok" : ""); mark(pc.connectionState); };
  const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?room=" + encodeURIComponent(room);
  ws = new WebSocket(wsUrl);
  ws.onmessage = (e) => onSignal(JSON.parse(e.data));
  await new Promise((r) => (ws.onopen = r));
  log("joined " + room + " as " + role);
  if (role === "offer") await sendDescription(await pc.createOffer());
}
async function gathered() {
  if (pc.iceGatheringState === "complete") return;
  await new Promise((r) => { pc.onicegatheringstatechange = () => pc.iceGatheringState === "complete" && r(); setTimeout(r, 5000); });
}
async function sendDescription(desc) {
  await pc.setLocalDescription(desc); await gathered();
  const sdp = pc.localDescription.sdp;
  const sig = b64(await crypto.subtle.sign({ name: "Ed25519" }, key.privateKey, new TextEncoder().encode(fps(sdp))));
  ws.send(JSON.stringify({ type: pc.localDescription.type, sdp, key: pub, sig }));
  const types = [...sdp.matchAll(/ typ (\w+)/g)].map((m) => m[1]);
  log(`${pc.localDescription.type} sent, candidates: ${types.join(" ") || "none"}`); mark("sent " + pc.localDescription.type);
}
async function verify(m) {
  try {
    const k = await crypto.subtle.importKey("raw", unb64(m.key), { name: "Ed25519" }, false, ["verify"]);
    const ok = await crypto.subtle.verify({ name: "Ed25519" }, k, unb64(m.sig), new TextEncoder().encode(fps(m.sdp)));
    if (!ok) return "signature does not match the fingerprints in the SDP";
    if (q.get("peer") && q.get("peer") !== m.key) return "signed by " + m.key + ", expected " + q.get("peer");
    return null;
  } catch (e) { return "bad signature: " + e.message; }
}
async function onSignal(m) {
  if (m.type === "offer" || m.type === "answer") {
    const bad = await verify(m);
    if (bad) { log("peer fingerprint REJECTED: " + bad, "bad"); summary.rejected = bad; mark("rejected"); report(); return hang(); }
    log("peer fingerprint verified" + (q.get("peer") ? ", key pinned" : " (key not pinned)") + " · peer key " + m.key, "ok");
    await pc.setRemoteDescription({ type: m.type, sdp: m.sdp });
    if (m.type === "offer") await sendDescription(await pc.createAnswer());
  } else if (m.type === "bye") { log("peer left"); }
}
function hang() { pc?.close(); ws?.close(); stream?.getTracks().forEach((t) => t.stop()); log("hung up"); }
async function poll() {
  if (!pc) return;
  const s = await pc.getStats(); let inb, out, pair, local, remote;
  s.forEach((x) => {
    if (x.type === "inbound-rtp" && x.kind === "audio") inb = x;
    if (x.type === "outbound-rtp" && x.kind === "audio") out = x;
    if (x.type === "candidate-pair" && (x.nominated || x.selected) && x.state === "succeeded") pair = x;
  });
  if (pair) { local = s.get(pair.localCandidateId); remote = s.get(pair.remoteCandidateId); }
  const v = {
    path: local ? `${local.candidateType} -> ${remote?.candidateType}` : "-",
    rttMs: pair?.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null,
    sent: out?.packetsSent, recv: inb?.packetsReceived, lost: inb?.packetsLost,
    jitterMs: inb?.jitter != null ? Math.round(inb.jitter * 1000) : null,
    jitterBufferMs: inb?.jitterBufferEmittedCount ? Math.round(1000 * inb.jitterBufferDelay / inb.jitterBufferEmittedCount) : null,
    level: inb?.audioLevel != null ? inb.audioLevel.toFixed(3) : null,
  };
  if (analyser) {
    const f = new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(f);
    let bi = 0; f.forEach((x, i) => { if (x > f[bi]) bi = i; });
    const t = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(t);
    v.heardPeakHz = Math.round(bi * analyser.rate / analyser.fftSize);
    v.heardRms = Math.sqrt(t.reduce((a, x) => a + x * x, 0) / t.length).toFixed(3);
  }
  summary.last = v;
  if (q.get("live")) fetch("/live", { method: "POST", body: JSON.stringify({ client, t: Date.now(), state: pc.connectionState, hidden: document.hidden, ...v }) }).catch(() => {});
  statsEl.textContent = Object.entries(v).map(([k, x]) => `${k.padEnd(15)} ${x ?? "-"}`).join("\n");
}
function report() { if (q.get("report")) fetch("/report", { method: "POST", body: JSON.stringify({ ...summary, done: true }) }); }
setInterval(poll, 1000);
if (q.get("seconds")) setTimeout(() => { report(); log("reported"); }, 1000 * Number(q.get("seconds")));
document.getElementById("go").onclick = () => start().catch((e) => log("ERR " + e.message, "bad"));
document.getElementById("hang").onclick = hang;
document.getElementById("mute").onclick = (e) => { const t = stream?.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; e.target.textContent = t.enabled ? "Mute" : "Unmute"; } };
if (q.get("auto")) document.getElementById("go").click();
</script>

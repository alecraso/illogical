<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S30 probe</title>
<style>body{font:14px ui-monospace,monospace;margin:16px;background:#111;color:#ddd}pre{white-space:pre-wrap}</style>
<h1>S30 WebRTC probe</h1>
<pre id="out">running…</pre>
<script>
// Checks, in one page, everything S30 asks of a client: the WebRTC API,
// a loopback call carrying audio, getUserMedia, Opus, and (with
// ?turn=turn:host:port&user=..&pass=..) that relay-only ICE connects.
const q = new URLSearchParams(location.search);
const r = { ua: navigator.userAgent, client: q.get("client") || "", t0: Date.now() };
const out = document.getElementById("out");
const show = () => (out.textContent = JSON.stringify(r, null, 2));
const step = async (name, f) => {
  try { r[name] = await f(); } catch (e) { r[name] = "ERR " + (e && (e.name + ": " + e.message)); }
  show();
};
const timeout = (p, ms, what) =>
  Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout " + what)), ms))]);

async function loopback(stream, cfg) {
  const a = new RTCPeerConnection(cfg), b = new RTCPeerConnection(cfg);
  const cands = { a: [], b: [] };
  a.onicecandidate = (e) => e.candidate && (cands.a.push(e.candidate.type), b.addIceCandidate(e.candidate));
  b.onicecandidate = (e) => e.candidate && (cands.b.push(e.candidate.type), a.addIceCandidate(e.candidate));
  stream.getTracks().forEach((t) => a.addTrack(t, stream));
  const got = new Promise((res) => (b.ontrack = res));
  const t = performance.now();
  await a.setLocalDescription(await a.createOffer());
  await b.setRemoteDescription(a.localDescription);
  await b.setLocalDescription(await b.createAnswer());
  await a.setRemoteDescription(b.localDescription);
  await timeout(new Promise((res) => {
    const f = () => a.connectionState === "connected" && res();
    a.onconnectionstatechange = f; f();
  }), 15000, "connect (" + a.connectionState + ")");
  const connectMs = Math.round(performance.now() - t);
  await timeout(got, 5000, "ontrack");
  await new Promise((res) => setTimeout(res, 2500));
  let inbound = null, codec = null, pair = null;
  (await b.getStats()).forEach((s) => {
    if (s.type === "inbound-rtp" && s.kind === "audio") inbound = s;
    if (s.type === "codec" && /audio/.test(s.mimeType || "")) codec = s.mimeType;
    if (s.type === "candidate-pair" && s.nominated) pair = s;
  });
  const res = {
    connectMs, codec, candidates: cands,
    bytesReceived: inbound && inbound.bytesReceived,
    packetsReceived: inbound && inbound.packetsReceived,
    audioLevel: inbound && inbound.audioLevel,
    rttMs: pair && pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null,
  };
  a.close(); b.close();
  return res;
}

function tone() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator(); o.frequency.value = 440;
  const d = ctx.createMediaStreamDestination(); o.connect(d); o.start();
  return d.stream;
}

(async () => {
  await step("api", () => ({
    RTCPeerConnection: typeof RTCPeerConnection,
    mediaDevices: typeof navigator.mediaDevices,
    getUserMedia: typeof (navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    RTCRtpScriptTransform: typeof window.RTCRtpScriptTransform,
    createEncodedStreams: typeof (window.RTCRtpSender && RTCRtpSender.prototype.createEncodedStreams),
    secureContext: window.isSecureContext,
  }));
  if (typeof RTCPeerConnection === "undefined") return finish();
  await step("opus", () => {
    const c = RTCRtpSender.getCapabilities && RTCRtpSender.getCapabilities("audio");
    return c ? c.codecs.map((x) => x.mimeType).filter((v, i, a) => a.indexOf(v) === i).join(" ") : "no getCapabilities";
  });
  await step("certificate", async () => {
    const c = await RTCPeerConnection.generateCertificate({ name: "ECDSA", namedCurve: "P-256" });
    return c.getFingerprints ? c.getFingerprints().map((f) => f.algorithm) : "no getFingerprints";
  });
  await step("loopbackTone", () => loopback(tone(), {}));
  await step("devices", async () => (await navigator.mediaDevices.enumerateDevices()).map((d) => d.kind + ":" + (d.label || "?")));
  await step("getUserMedia", async () => {
    const s = await timeout(navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }), Number(q.get("gumwait") || 15000), "gUM");
    const t = s.getAudioTracks()[0];
    r.gumSettings = t.getSettings ? t.getSettings() : null;
    r.loopbackMic = await loopback(s, {}).catch((e) => "ERR " + e.message);
    s.getTracks().forEach((x) => x.stop());
    return t.label || "ok";
  });
  if (q.get("turn")) {
    await step("relayOnly", () => loopback(tone(), {
      iceTransportPolicy: "relay",
      iceServers: [{ urls: q.get("turn"), username: q.get("user"), credential: q.get("pass") }],
    }));
  }
  finish();
})();

function finish() {
  r.ms = Date.now() - r.t0; r.done = true; show();
  const msg = JSON.stringify(r);
  try { window.webkit.messageHandlers.probe.postMessage(msg); } catch {}
  if (q.get("report")) fetch(q.get("report"), { method: "POST", body: msg }).catch(() => {});
}
</script>

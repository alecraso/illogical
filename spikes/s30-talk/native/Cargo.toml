[package]
name = "s30-native"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace: the root workspace never builds spikes.
[workspace]

[dependencies]
webrtc = "0.21"
rtc = { version = "0.21", default-features = false }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
anyhow = "1"
bytes = "1"
cpal = "0.18"
opus = "0.3"
hound = "3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }
webrtc-audio-processing-config = "2.1"

[profile.release]
strip = true

# The hosted illogical control (control.illogical.widgets.wtf). One machine
# with its SQLite database on a volume. Secrets (fly secrets set):
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET. Deploy with `just control-deploy`.
app = "illogical-control"
primary_region = "ewr"

[env]
  ILLOGICAL_CONTROL_URL = "https://control.illogical.widgets.wtf"
  ILLOGICAL_CONTROL_LISTEN = "0.0.0.0:7690"
  ILLOGICAL_CONTROL_DB = "/data/control.db"
  ILLOGICAL_CONTROL_PROXY_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "control_data"
  destination = "/data"

[http_service]
  internal_port = 7690
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 8000
    hard_limit = 10000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/control.json"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# The hosted illogical control (control.arugula.io, and the old
# control.illogical.widgets.wtf while people move: docs/control.md, "Moving
# to another URL"). One machine
# with its SQLite database on a volume, backed up off-site by Litestream
# when its secrets are set. Secrets (fly secrets set): the GitHub App's
# (GITHUB_APP_*, which also signs people in at both URLs); LITESTREAM_BUCKET, LITESTREAM_ENDPOINT,
# LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY (docs/control.md,
# "Operating the hosted one"); CLOUDFLARE_TURN_KEY_ID,
# CLOUDFLARE_TURN_API_TOKEN (TURN for huddles, M63). Deploy with
# `just control-deploy`.
app = "illogical-control"
primary_region = "ewr"
# On a stop, control lets Litestream sync one last time (up to 10 s).
kill_signal = "SIGTERM"
kill_timeout = "15s"

[env]
  ILLOGICAL_CONTROL_URL = "https://control.arugula.io"
  ILLOGICAL_CONTROL_ALSO_URLS = "https://control.illogical.widgets.wtf"
  ILLOGICAL_CONTROL_LISTEN = "0.0.0.0:7690"
  ILLOGICAL_CONTROL_DB = "/data/control.db"
  ILLOGICAL_CONTROL_PROXY_HEADER = "Fly-Client-IP"
  # Relay sockets, all accounts together (#344): below soft_limit, so a
  # full relay leaves room for pages and sign-ins.
  ILLOGICAL_RELAY_MAX_TOTAL = "5000"

[[mounts]]
  source = "control_data"
  destination = "/data"

[http_service]
  internal_port = 7690
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # An idle relay connection costs control about 28 KB (#174: 3,900 of them
  # took 121 MB in a 1 GB VM), so memory isn't the limit at these numbers;
  # open files are (control raises its own limit to the hard one at start,
  # and logs it). Past the soft limit Fly prefers another machine (there's
  # none yet); at the hard limit it queues new connections.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 6000
    hard_limit = 8000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/control.json"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

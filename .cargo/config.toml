[env]
# libghostty-vt-sys builds Ghostty in Zig's Debug mode for dev builds, which
# runs ~3000x slower (0.2 MB/s). ReleaseSafe keeps safety checks (the engine
# parses untrusted program output) and runs at hundreds of MB/s.
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseSafe"
# Test daemons register as Claude Code's IDE (M28) here, not in ~/.claude.
# Not under target/: with CARGO_TARGET_DIR elsewhere (CI), that made a real
# target/ directory, where `just e2e-build` wants its link.
ILLOGICAL_CLAUDE_IDE_DIR = { value = ".cargo/claude-ide", relative = true }

# The local test stack (#200). One profile per scenario; `just testnet up
# <profile>` brings one up. Everything is named illogical-testnet-*, so
# `just testnet down` removes it and nothing else. See testnet/README.md.
# COMPOSE_PROJECT_NAME replaces the illogical-testnet prefix, so two stacks
# can run side by side; the scripts give each its own state directory.
name: illogical-testnet

networks:
  # The outer network. The bastion is the only thing on it so far.
  outer:
    name: ${COMPOSE_PROJECT_NAME:-illogical-testnet}
  # Only ssh gets through: no route out, and nothing published to the host.
  # The bastion is on both networks.
  inner:
    name: ${COMPOSE_PROJECT_NAME:-illogical-testnet}-inner
    internal: true

x-sshd: &sshd
  build: ./sshd
  image: illogical-testnet-sshd
  volumes:
    - ${ILLOGICAL_TESTNET_STATE:-./.state}:/keys:ro

services:
  bastion:
    <<: *sshd
    profiles: [ssh]
    container_name: ${COMPOSE_PROJECT_NAME:-illogical-testnet}-bastion
    hostname: bastion
    environment: { TESTNET_NAME: bastion }
    ports:
      - "127.0.0.1:${ILLOGICAL_TESTNET_SSH_PORT:-22922}:22"
    networks: [outer, inner]

  box-bare:
    <<: *sshd
    profiles: [ssh]
    container_name: ${COMPOSE_PROJECT_NAME:-illogical-testnet}-box-bare
    hostname: box-bare
    environment: { TESTNET_NAME: box-bare }
    networks: [inner]

  # systemd as PID 1 (logind, polkit), for linger without sudo. Needs a
  # privileged container with its own cgroup namespace.
  box-systemd:
    profiles: [ssh]
    build: ./sshd-systemd
    image: illogical-testnet-sshd-systemd
    container_name: ${COMPOSE_PROJECT_NAME:-illogical-testnet}-box-systemd
    hostname: box-systemd
    privileged: true
    cgroup: private
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - ${ILLOGICAL_TESTNET_STATE:-./.state}:/keys:ro
    networks: [inner]

  # A git server (bare repositories over ssh) for M51's `git push` from a
  # pane with the agent forwarded through `illogical --ssh`. git@git:repo.git.
  git:
    profiles: [ssh]
    build: ./git
    image: illogical-testnet-git
    container_name: ${COMPOSE_PROJECT_NAME:-illogical-testnet}-git
    hostname: git
    volumes:
      - ${ILLOGICAL_TESTNET_STATE:-./.state}:/keys:ro
    networks: [inner]

# One box for M28's VS Code over Remote-SSH test (testnet/editors/README.md).
name: arugula-testnet-editors

services:
  box:
    build: ./box
    image: arugula-testnet-editors-box
    hostname: m28-box
    init: true
    environment:
      DAEMON_PORT: "${ARUGULA_TESTNET_EDITORS_DAEMON_PORT:-17752}"
    volumes:
      - ./.state:/keys:ro
      - "${ARUGULA_TESTNET_BIN:?the static build: target/ARCH-unknown-linux-musl/release}:/opt/arugula:ro"
      - "${ARUGULA_TESTNET_TOKEN_DIR:?a directory with local-token}:/token:ro"
    ports:
      - "127.0.0.1:${ARUGULA_TESTNET_EDITORS_SSH_PORT:-17751}:22"
      - "127.0.0.1:${ARUGULA_TESTNET_EDITORS_DAEMON_PORT:-17752}:${ARUGULA_TESTNET_EDITORS_DAEMON_PORT:-17752}"

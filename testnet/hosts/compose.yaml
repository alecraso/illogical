# Two machines side by side for #17's mixed-host layout: `home`, whose
# layout the page shows, and `mac`, whose panes have places in it. Each
# runs the static arugulad on its own loopback; a socat in the same
# network namespace hands it what arrives on the box's address, so the
# daemon sees a local peer that must show the local token, as on a laptop.
# `docker network disconnect` on `mac` takes it, and its forwarder, off
# the network with the daemon and its panes still running.
# See testnet/hosts/README.md.
name: arugula-testnet-hosts

networks:
  hosts:
    ipam:
      config:
        - subnet: "${ARUGULA_TESTNET_HOSTS_SUBNET:-172.31.77.0/24}"

x-box: &box
  image: debian:bookworm-slim
  init: true
  volumes:
    - "${ARUGULA_TESTNET_BIN:?the static build: target/ARCH-unknown-linux-musl/release}:/opt/arugula:ro"
    - "${ARUGULA_TESTNET_TOKEN_DIR:?a directory with local-token}:/token:ro"
  environment:
    ARUGULA_LOCAL_TOKEN_FILE: /token/local-token

services:
  home:
    <<: *box
    hostname: home
    command:
      - /opt/arugula/arugulad
      - --listen=127.0.0.1:${ARUGULA_TESTNET_HOME_PORT:-17748}
      - --name=home
      - --state-dir=/state
      - --shell=bash --norc --noprofile
      - --no-manager-env
      - --tailscale-socket=/nonexistent/tailscaled.sock
    ports:
      - "127.0.0.1:${ARUGULA_TESTNET_HOME_PORT:-17748}:${ARUGULA_TESTNET_HOME_PORT:-17748}"
    networks:
      hosts:
        ipv4_address: "${ARUGULA_TESTNET_HOME_IP:-172.31.77.10}"

  home-fwd:
    image: alpine/socat:1.8.0.3
    network_mode: "service:home"
    command: "TCP-LISTEN:${ARUGULA_TESTNET_HOME_PORT:-17748},bind=${ARUGULA_TESTNET_HOME_IP:-172.31.77.10},fork,reuseaddr TCP:127.0.0.1:${ARUGULA_TESTNET_HOME_PORT:-17748}"

  mac:
    <<: *box
    hostname: mac
    command:
      - /opt/arugula/arugulad
      - --listen=127.0.0.1:${ARUGULA_TESTNET_MAC_PORT:-17749}
      - --name=mac
      - --state-dir=/state
      - --shell=bash --norc --noprofile
      - --no-manager-env
      - --tailscale-socket=/nonexistent/tailscaled.sock
      # home's page connects here for mac's panes.
      - --allow-origin=http://127.0.0.1:${ARUGULA_TESTNET_HOME_PORT:-17748}
    ports:
      - "127.0.0.1:${ARUGULA_TESTNET_MAC_PORT:-17749}:${ARUGULA_TESTNET_MAC_PORT:-17749}"
    networks:
      hosts:
        ipv4_address: "${ARUGULA_TESTNET_MAC_IP:-172.31.77.11}"

  mac-fwd:
    image: alpine/socat:1.8.0.3
    network_mode: "service:mac"
    command: "TCP-LISTEN:${ARUGULA_TESTNET_MAC_PORT:-17749},bind=${ARUGULA_TESTNET_MAC_IP:-172.31.77.11},fork,reuseaddr TCP:127.0.0.1:${ARUGULA_TESTNET_MAC_PORT:-17749}"
